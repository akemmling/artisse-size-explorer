name: Update community stats

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours (GitHub runs these late by up to a few hours)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: community-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch statistics from GoatCounter
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: python3 scripts/fetch_community_stats.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- stats/community.json; then
            echo "no change"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats/community.json
          git commit -m "Update community stats [skip ci]"
          git push
